name: Miner Automation - W4, W5, W6

on:
  workflow_dispatch:
    inputs:
      workflow_choice:
        description: 'Select workflow to run'
        required: true
        default: 'W4'
        type: choice
        options:
          - 'W4 - Terminals 91 to 120'
          - 'W5 - Terminals 121 to 150'
          - 'W6 - Terminals 151 to 180'

jobs:
  mining:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Show System Info
      shell: pwsh
      run: |
        Write-Host "=== SYSTEM INFORMATION ==="
        Write-Host ""
        Write-Host "CPU:"
        Get-WmiObject -Class Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed | Format-List
        Write-Host ""
        Write-Host "RAM:"
        $ram = Get-WmiObject -Class Win32_ComputerSystem
        Write-Host "Total Physical Memory: $([math]::Round($ram.TotalPhysicalMemory / 1GB, 0)) GB"
        Write-Host ""
        Write-Host "OS:"
        Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion
        Write-Host ""
        Write-Host "Disk:"
        Get-PSDrive -Name C | Select-Object Used, Free
    
    - name: Install Firefox
      run: |
        choco install firefox -y
      shell: pwsh
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests psutil pillow
    
    - name: Run Workflow W4
      if: github.event.inputs.workflow_choice == 'W4 - Terminals 91 to 120'
      run: python miner_w4_w5_w6.py --workflow W4
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    
    - name: Run Workflow W5
      if: github.event.inputs.workflow_choice == 'W5 - Terminals 121 to 150'
      run: python miner_w4_w5_w6.py --workflow W5
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    
    - name: Run Workflow W6
      if: github.event.inputs.workflow_choice == 'W6 - Terminals 151 to 180'
      run: python miner_w4_w5_w6.py --workflow W6
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: miner-logs
        path: miner_monitor.log
        retention-days: 7
